name: Build iOS BotWRecomp IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'App Bundle Identifier'
        required: false
        default: 'com.botw.recomp'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          missing=()
          for pkg in cmake ninja uv boost glm ccache; do
            brew list "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            brew install "${missing[@]}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache generated C++ code
        uses: actions/cache@v4
        with:
          path: generated
          key: generated-${{ runner.os }}-${{ hashFiles('U-King.rpx', 'cafe/*.py', 'tools/recompile.py', 'runtime/src/game/*.cpp') }}

      - name: Generate C++ Code (if not present)
        run: |
          if [ ! -f "generated/table.cpp" ]; then
            if [ -f "U-King.rpx" ]; then
              echo "== Generating C++ files from U-King.rpx =="
              mkdir -p generated
              python3 -I tools/recompile.py U-King.rpx generated
            else
              echo "Error: Neither generated/table.cpp nor U-King.rpx found!"
              exit 1
            fi
          else
            echo "== generated/ C++ code already present =="
          fi

      - name: Cache iOS Dependencies
        id: cache-ios-deps
        uses: actions/cache@v4
        with:
          path: ios-deps/prefix-iphoneos
          key: ios-deps-iphoneos-${{ hashFiles('ios/scripts/build_deps.sh', 'ios/scripts/env.sh') }}

      - name: Build iOS Dependencies (SDL3, fmt, zstd)
        if: steps.cache-ios-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x ios/scripts/*.sh
          ./ios/scripts/build_deps.sh iphoneos

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ runner.os }}-

      - name: Configure CMake for iOS
        env:
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.botw.recomp' }}
        run: |
          cmake -S ios -B build-ios/iphoneos -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DBOTW_BUNDLE_ID="$BUNDLE_ID" \
            -DBOTW_IOS_DEPS="$PWD/ios-deps"

      - name: Pre-compile runtime, host & Cemu GPU (fast check)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          cmake --build build-ios/iphoneos --target cemu_gpu -j 4
          RUNTIME_OBJS=$(ninja -C build-ios/iphoneos -t targets all | grep -E '^CMakeFiles/BotWRecomp\.dir/.*\.(cpp|mm)\.o:' | cut -d: -f1)
          if [ -n "$RUNTIME_OBJS" ]; then
            echo "$RUNTIME_OBJS" | xargs ninja -C build-ios/iphoneos -j 4
          fi

      - name: Build BotWRecomp
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          cmake --build build-ios/iphoneos -j 4
          ccache -s || true

      - name: Ad-Hoc Sign & Package IPA
        run: |
          APP_PATH="build-ios/iphoneos/BotWRecomp.app"
          ENTITLEMENTS="ios/BotWRecomp.entitlements"
          
          # Ad-hoc sign the app bundle with increased memory limit entitlement
          codesign --force --sign - --timestamp=none --entitlements "$ENTITLEMENTS" "$APP_PATH"
          codesign --verify --strict "$APP_PATH" || true
          
          # Package into IPA
          mkdir -p build-ios/iphoneos/Payload
          cp -R "$APP_PATH" build-ios/iphoneos/Payload/
          cd build-ios/iphoneos
          zip -qr BotWRecomp.ipa Payload/
          echo "IPA packaging complete: $(ls -lh BotWRecomp.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotWRecomp-iOS18-IPA
          path: build-ios/iphoneos/BotWRecomp.ipa
          retention-days: 14
